<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/css/pptxjs.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/css/nv.d3.min.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="">

<div class="title">🤖 Claude for AQA Engineers — Implementation Roadmap</div>
<div class="timeline">
  <div id="content-loading" class="content-loading">Loading roadmap…</div>
</div>
</div>

<script>
  // ── Inline PNG slideshow ──────────────────────────────────────────────
  // Slides are pre-rendered by ./rebuild.sh into
  //   presentations/<key>/slide-NN.png + manifest.json (with slide count).
  // Each `.card.has-pptx` carries its own viewer state on its DOM element
  // (`__pptxState`), so multiple cards can host their own decks.

  function toggle(card) {
    var wasOpen = card.classList.contains('open');
    card.parentElement.querySelectorAll('.card').forEach(function(c) { c.classList.remove('open'); });
    if (!wasOpen) card.classList.add('open');
  }
  function tcToggle(n) {
    var card = document.getElementById('tc'+n);
    var wasOpen = card.classList.contains('open');
    [1,2,3,4].forEach(function(i){ document.getElementById('tc'+i).classList.remove('open'); });
    if (!wasOpen) card.classList.add('open');
  }

  function slidePath(key, i) {
    var n = String(i + 1).padStart(2, '0');
    return '/storage/presentations/' + key + '/slide-' + n + '.png';
  }

  // A "host" is any element with class="has-pptx" + data-pptx-key + a child .pptx-inline.
  function findPptxHost(node) {
    return node.closest('.has-pptx');
  }

  // Called by the phase-header "Presentation" button.
  function togglePhasePptx(btn) {
    var host = findPptxHost(btn);
    if (!host) return;
    var willOpen = !host.classList.contains('pptx-open');
    host.classList.toggle('pptx-open', willOpen);
    btn.setAttribute('aria-expanded', String(willOpen));
    btn.querySelector('.pptx-phase-label').textContent = willOpen ? 'Hide' : 'Presentation';
    if (willOpen) {
      initInlinePptx(host);
      host.querySelector('.pptx-inline').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // Called by the phase-header "Upload" button (edit mode). Opens a file
  // picker, POSTs the .pptx to /_upload-pptx, waits for LibreOffice to render
  // the slides, then refreshes the inline viewer.
  function uploadPptx(btn) {
    var host = findPptxHost(btn);
    if (!host) return;
    var key = host.dataset.pptxKey;
    if (!key) { alert('This phase has no pptx key.'); return; }

    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.onchange = function() {
      var file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      sendPptxUpload(host, btn, key, file);
    };
    input.click();
  }

  function removePptx(btn) {
    var host = findPptxHost(btn);
    if (!host) return;
    var key = host.dataset.pptxKey;
    if (!key) return;

    var label = btn.querySelector('.pptx-remove-label');
    var orig = label ? label.textContent : '';
    if (label) label.textContent = 'Removing…';
    btn.disabled = true;

    fetch('/_delete-pptx?key=' + encodeURIComponent(key), { method: 'POST' })
      .then(function(r) {
        return r.json().then(function(body) {
          if (!r.ok || !body.ok) throw new Error(body.error || ('HTTP ' + r.status));
          return body;
        });
      })
      .then(function() {
        btn.disabled = false;
        if (label) label.textContent = orig;
        // Reset viewer state — next time user clicks Presentation, it'll show
        // the friendly "Slides not built yet" message.
        host.__pptxState = null;
        var stage = host.querySelector('.pptx-inline-stage');
        if (stage) stage.innerHTML = '';
        // If panel is open, close it
        if (host.classList.contains('pptx-open')) {
          var pb = host.querySelector('.pptx-phase-btn');
          if (pb) togglePhasePptx(pb);
        }
        setToolbarMessage('✓ Deck removed for this phase', 'ok');
      })
      .catch(function(err) {
        btn.disabled = false;
        if (label) label.textContent = orig;
        setToolbarMessage('Delete failed: ' + (err.message || err), 'err');
        console.error('removePptx:', err);
      });
  }

  function sendPptxUpload(host, btn, key, file) {
    var label = btn.querySelector('.pptx-upload-label');
    var origLabel = label ? label.textContent : '';
    if (label) label.textContent = 'Uploading…';
    btn.disabled = true;

    // Open the viewer so the user sees progress immediately.
    if (!host.classList.contains('pptx-open')) {
      var phaseBtn = host.querySelector('.pptx-phase-btn');
      if (phaseBtn) togglePhasePptx(phaseBtn);
    }
    var loading = host.querySelector('.pptx-inline-loading');
    if (loading) {
      loading.innerHTML = '<div class="pptx-spinner"></div>' +
        '<div>Uploading + rendering ' + escapeHtml(file.name) + '…</div>' +
        '<div style="font-size:10px;color:#64748b;margin-top:4px">This usually takes 5–30 seconds.</div>';
      loading.classList.remove('hidden');
    }

    fetch('/_upload-pptx?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/vnd.openxmlformats-officedocument.presentationml.presentation' },
      body: file,
    })
      .then(function(r) {
        return r.json().then(function(body) {
          if (!r.ok || !body.ok) throw new Error(body.error || ('HTTP ' + r.status));
          return body;
        });
      })
      .then(function(result) {
        btn.disabled = false;
        if (label) label.textContent = origLabel;
        // Reset state and re-init so the new slides load
        host.__pptxState = null;
        var stage = host.querySelector('.pptx-inline-stage');
        if (stage) stage.innerHTML = '';
        initInlinePptx(host);
      })
      .catch(function(err) {
        btn.disabled = false;
        if (label) label.textContent = origLabel;
        if (loading) {
          loading.innerHTML = '<div style="color:#fca5a5;text-align:center;max-width:420px;line-height:1.6;">' +
            '<div style="font-size:28px">⚠️</div>' +
            '<div style="font-size:13px;font-weight:700;margin-bottom:6px">Upload failed</div>' +
            '<div style="font-size:11px;color:#94a3b8;">' + escapeHtml(String(err.message || err)) + '</div></div>';
        }
        console.error('uploadPptx:', err);
      });
  }

  function initInlinePptx(host) {
    if (host.__pptxState && host.__pptxState.count > 0) return; // already loaded
    var key = host.dataset.pptxKey;
    var viewer = host.querySelector('.pptx-inline');
    if (!key || !viewer) return;

    host.__pptxState = { key: key, count: 0, index: 0, loaded: {}, viewer: viewer };
    var stage = viewer.querySelector('.pptx-inline-stage');
    var loading = viewer.querySelector('.pptx-inline-loading');
    stage.innerHTML = '';
    loading.classList.remove('hidden');

    fetch('/storage/presentations/' + key + '/manifest.json', { cache: 'no-cache' })
      .then(function(r) {
        if (!r.ok) throw new Error('manifest ' + r.status);
        return r.json();
      })
      .then(function(m) {
        host.__pptxState.count = m.slides || 0;
        if (!host.__pptxState.count) throw new Error('manifest has no slides');
        loading.classList.add('hidden');
        showInlinePptx(host, 0);
      })
      .catch(function(err) {
        loading.innerHTML =
          '<div style="color:#fca5a5; text-align:center; max-width:420px; line-height:1.6;">' +
          '<div style="font-size:28px; margin-bottom:8px;">⚠️</div>' +
          '<div style="font-size:13px; font-weight:700; margin-bottom:6px;">Slides not built yet</div>' +
          '<div style="font-size:11px; color:#94a3b8;">' +
          'Run <code style="background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:3px;">./rebuild.sh</code> ' +
          'to generate them.<br><span style="font-size:10px; opacity:0.7;">(' + err.message + ')</span>' +
          '</div></div>';
      });
  }

  function ensureInlineImage(host, i) {
    var st = host.__pptxState;
    if (st.loaded[i]) return st.loaded[i];
    var img = document.createElement('img');
    img.src = slidePath(st.key, i);
    img.dataset.index = String(i);
    img.alt = 'Slide ' + (i + 1);
    img.style.display = 'none';
    // If the file vanished (deleted manifestlessly), replace with inline error
    // instead of leaving the slot blank.
    img.onerror = function() {
      var stage = host.querySelector('.pptx-inline-stage');
      if (!stage) return;
      // Only show the error if THIS slide is the one currently visible.
      if (st.index === i) {
        stage.querySelectorAll('img').forEach(function(el) { el.style.display = 'none'; });
        var msg = stage.querySelector('.pptx-missing-msg');
        if (!msg) {
          msg = document.createElement('div');
          msg.className = 'pptx-missing-msg';
          msg.style.cssText = 'color:#fca5a5; text-align:center; padding:24px; line-height:1.6;';
          stage.appendChild(msg);
        }
        msg.innerHTML = '<div style="font-size:28px">⚠️</div>' +
          '<div style="font-size:13px; font-weight:700; margin-top:6px;">Slide ' + (i + 1) + ' is missing on disk</div>' +
          '<div style="font-size:11px; color:#94a3b8; margin-top:4px;">Re-upload the .pptx or run <code>./backend/rebuild.sh</code></div>';
      }
    };
    host.querySelector('.pptx-inline-stage').appendChild(img);
    st.loaded[i] = img;
    return img;
  }

  function showInlinePptx(host, i) {
    var st = host.__pptxState;
    var stage = host.querySelector('.pptx-inline-stage');
    ensureInlineImage(host, i);
    Array.from(stage.children).forEach(function(el) { el.style.display = 'none'; });
    st.loaded[i].style.display = 'block';
    st.index = i;
    // Clear any "missing slide" message left over from a previous failure
    var missing = stage.querySelector('.pptx-missing-msg');
    if (missing) missing.remove();
    [i - 1, i + 1].forEach(function(j) {
      if (j >= 0 && j < st.count) ensureInlineImage(host, j);
    });
    updateInlineCounter(host);
  }

  function updateInlineCounter(host) {
    var st = host.__pptxState;
    if (!st || !st.count) return;
    host.querySelector('.pptx-inline-counter').textContent = (st.index + 1) + ' / ' + st.count;
    host.querySelector('.pptx-nav-prev').disabled = st.index === 0;
    host.querySelector('.pptx-nav-next').disabled = st.index === st.count - 1;
  }

  function navInlinePptx(btn, delta) {
    var host = findPptxHost(btn);
    if (!host || !host.__pptxState || !host.__pptxState.count) return;
    var st = host.__pptxState;
    var next = Math.max(0, Math.min(st.count - 1, st.index + delta));
    if (next === st.index) return;
    showInlinePptx(host, next);
  }

  function toggleInlinePptxFs(btn) {
    var viewer = btn.closest('.pptx-inline');
    if (!viewer) return;
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (viewer.requestFullscreen) {
      viewer.requestFullscreen().catch(function(){});
    }
  }

  // Arrow keys navigate the open .has-pptx host (the one that's pptx-open). F toggles fullscreen.
  document.addEventListener('keydown', function(e) {
    var host = document.querySelector('.has-pptx.pptx-open');
    if (!host || !host.__pptxState || !host.__pptxState.count) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      navInlinePptx(host.querySelector('.pptx-nav-next'), 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      navInlinePptx(host.querySelector('.pptx-nav-prev'), -1);
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      toggleInlinePptxFs(host.querySelector('.pptx-fs-btn'));
    }
  });

  // ── ROADMAP EDITOR ────────────────────────────────────────────────────
  // Default state is view-only. Click "Edit" to enter edit mode → text becomes
  // editable, X / + buttons + drag handles appear, SortableJS enables drag.
  // Save POSTs the cleaned HTML to server.py's /_save endpoint.

  var EDITABLE_SELECTORS = [
    '.phase-num',
    '.phase-title',
    '.card-title',
    '.card-detail li'
  ];
  var STORAGE_KEY = 'roadmap-edits-v1';
  var EDIT_MODE = false;
  var sortablePhases = null;
  var sortableCards = [];

  function stopProp(e) {
    // Only block the card toggle when this element is actually editable (edit mode).
    // In view mode, let the click bubble up so clicking anywhere on the card opens it.
    if (e.currentTarget.getAttribute('contenteditable') === 'true') {
      e.stopPropagation();
    }
  }
  function pasteAsPlainText(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  }
  function editKeyGuard(e) {
    var singleLine = ['phase-num', 'phase-title', 'card-title'];
    if (e.key === 'Enter' && singleLine.some(function(c){ return e.currentTarget.classList.contains(c); })) {
      e.preventDefault();
      e.currentTarget.blur();
    }
  }
  function onEdit() {
    saveToStorage();
    setEditorState('dirty');
  }

  // Walk the document and ensure every editable element has a stable data-edit-id.
  // Existing IDs are preserved so localStorage entries keep matching.
  function reassignEditIds() {
    var used = new Set();
    document.querySelectorAll('[data-edit-id]').forEach(function(el) { used.add(el.dataset.editId); });
    var counter = used.size;
    EDITABLE_SELECTORS.forEach(function(sel) {
      document.querySelectorAll(sel).forEach(function(el) {
        if (el.closest('.pptx-inline')) return;
        if (!el.dataset.editId) {
          var id;
          do { counter++; id = 'e' + counter; } while (used.has(id));
          el.dataset.editId = id;
          used.add(id);
          // Attach edit listeners once
          el.spellcheck = false;
          el.addEventListener('mousedown', stopProp);
          el.addEventListener('click', stopProp);
          el.addEventListener('input', onEdit);
          el.addEventListener('paste', pasteAsPlainText);
          el.addEventListener('keydown', editKeyGuard);
        }
      });
    });
  }

  function applyContentEditable(on) {
    document.querySelectorAll('[data-edit-id]').forEach(function(el) {
      if (on) el.setAttribute('contenteditable', 'true');
      else el.removeAttribute('contenteditable');
    });
  }

  function saveToStorage() {
    if (!EDIT_MODE) return;
    var data = {};
    document.querySelectorAll('[data-edit-id]').forEach(function(el) {
      data[el.dataset.editId] = el.innerHTML;
    });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }
  function restoreFromStorage() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { return false; }
    if (!raw) return false;
    var data;
    try { data = JSON.parse(raw); } catch(e) { return false; }
    var restored = 0;
    Object.keys(data).forEach(function(id) {
      var el = document.querySelector('[data-edit-id="' + id + '"]');
      if (el && el.innerHTML !== data[id]) { el.innerHTML = data[id]; restored++; }
    });
    return restored > 0;
  }
  function clearStorage() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} }

  function buildCleanHtml() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(function(el) { el.removeAttribute('contenteditable'); });
    clone.querySelectorAll('[spellcheck]').forEach(function(el) { el.removeAttribute('spellcheck'); });
    clone.querySelectorAll('[data-edit-id]').forEach(function(el) { el.removeAttribute('data-edit-id'); });
    // Strip edit-only UI: toolbar, X buttons, +Add buttons, drag handles
    var toolbar = clone.querySelector('#editor-toolbar');
    if (toolbar) toolbar.remove();
    clone.querySelectorAll('.edit-remove-btn, .edit-add-card-btn, .edit-add-phase-btn, .card-drag-handle').forEach(function(el){ el.remove(); });
    // Remove SortableJS-added attrs
    clone.querySelectorAll('[draggable]').forEach(function(el){ el.removeAttribute('draggable'); });
    // Remove leftover edit-mode class on body (clone is <html>, not document)
    var cloneBody = clone.querySelector('body');
    if (cloneBody) cloneBody.classList.remove('edit-mode');
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  function setToolbarMessage(text, kind) {
    var tb = document.getElementById('editor-toolbar');
    if (!tb) return;
    var status = tb.querySelector('.editor-status');
    if (!status) return;
    var orig = status.dataset.origHtml || (status.dataset.origHtml = status.innerHTML);
    status.innerHTML = '<span style="color:' + (kind === 'err' ? '#fca5a5' : kind === 'ok' ? '#34d399' : '#94a3b8') + '">' + text + '</span>';
    clearTimeout(setToolbarMessage._t);
    setToolbarMessage._t = setTimeout(function() { status.innerHTML = orig; }, 3500);
  }

  function saveChanges() {
    // Serialize the current timeline to markdown and write it back to content.md
    var md;
    try { md = serializeRoadmapToMd(); }
    catch (err) { setToolbarMessage('Serialize failed: ' + err.message, 'err'); return; }
    fetch('/_save-content', { method: 'POST', headers: { 'Content-Type': 'text/markdown;charset=utf-8' }, body: md })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json().catch(function(){ return {}; });
      })
      .then(function() {
        clearStorage();
        setEditorState('clean');
        setToolbarMessage('✓ Saved to content.md', 'ok');
        exitEditMode();
      })
      .catch(function(err) {
        var msg = (err && err.message) || String(err);
        if (msg.indexOf('404') !== -1 || msg.indexOf('501') !== -1) {
          setToolbarMessage('Save endpoint missing — run python3 backend/server.py', 'err');
        } else {
          setToolbarMessage('Save failed: ' + msg, 'err');
        }
        console.error('saveChanges:', err);
      });
  }
  function setEditorState(state) {
    var tb = document.getElementById('editor-toolbar');
    if (tb) tb.dataset.state = state;
  }

  // Inject the toolbar (Edit button visible in view mode; Save+Done in edit mode)
  function mountEditorToolbar() {
    var tb = document.createElement('div');
    tb.id = 'editor-toolbar';
    tb.dataset.state = 'clean';
    tb.dataset.mode = 'view';
    tb.innerHTML =
      '<span class="editor-status toolbar-edit-only">' +
      '  <span class="editor-status-clean">✎ Edit mode — click any title/bullet to edit</span>' +
      '  <span class="editor-status-dirty">● Unsaved changes</span>' +
      '</span>' +
      '<button type="button" class="editor-btn editor-primary toolbar-view-only" onclick="enterEditMode()" title="Enter edit mode">Edit</button>' +
      '<button type="button" class="editor-btn editor-primary toolbar-edit-only" onclick="saveChanges()" title="Save changes and exit edit mode">Save</button>';
    document.body.appendChild(tb);
  }

  // ── Edit / View mode transitions ──
  function enterEditMode() {
    EDIT_MODE = true;
    document.body.classList.add('edit-mode');
    applyContentEditable(true);
    var tb = document.getElementById('editor-toolbar');
    if (tb) tb.dataset.mode = 'edit';
    // restore any pending local edits and mark dirty if present
    if (restoreFromStorage()) setEditorState('dirty');
    initSortable();
  }
  function exitEditMode() {
    EDIT_MODE = false;
    document.body.classList.remove('edit-mode');
    applyContentEditable(false);
    var tb = document.getElementById('editor-toolbar');
    if (tb) tb.dataset.mode = 'view';
    destroySortable();
  }

  // ── Drag-and-drop ──
  function initSortable() {
    if (typeof Sortable === 'undefined') return;
    var timeline = document.querySelector('.timeline');
    if (timeline) {
      sortablePhases = Sortable.create(timeline, {
        handle: '.phase-connector',
        draggable: '.phase',
        animation: 200,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        onEnd: onSortEnd,
      });
    }
    document.querySelectorAll('.cards').forEach(function(c) { addSortableForCards(c); });
  }
  function addSortableForCards(container) {
    if (typeof Sortable === 'undefined') return;
    var s = Sortable.create(container, {
      handle: '.card-drag-handle',
      draggable: '.card',
      animation: 200,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd: onSortEnd,
    });
    sortableCards.push(s);
  }
  function destroySortable() {
    if (sortablePhases) { try { sortablePhases.destroy(); } catch(e){} sortablePhases = null; }
    sortableCards.forEach(function(s) { try { s.destroy(); } catch(e){} });
    sortableCards = [];
  }
  function onSortEnd() {
    renumberPhases();
    recolorPhases();
    setEditorState('dirty');
    saveToStorage();
  }

  function renumberPhases() {
    document.querySelectorAll('.timeline .phase').forEach(function(phase, idx) {
      var num = phase.querySelector('.phase-num');
      if (num) num.textContent = 'Phase ' + (idx + 1);
    });
  }

  // Cycle phases through the brand color pairings (p1 … p7) based on position.
  // Wraps around: phase 8 → p1, phase 9 → p2, etc.
  var ALL_COLOR_CLASSES = ['p1','p2','p3','p4','p5','p6','p7','p-new'];
  function recolorPhases() {
    document.querySelectorAll('.timeline .phase').forEach(function(phase, idx) {
      var color = PHASE_COLORS[idx % PHASE_COLORS.length];
      ['.phase-dot', '.phase-line', '.phase-body', '.phase-num'].forEach(function(sel) {
        var el = phase.querySelector(sel);
        if (!el) return;
        ALL_COLOR_CLASSES.forEach(function(c) { el.classList.remove(c); });
        el.classList.add(color);
      });
    });
  }

  // ── Edit affordance injection ──
  function injectEditControlsAll() {
    document.querySelectorAll('.phase').forEach(injectPhaseControls);
    document.querySelectorAll('.card').forEach(injectCardControls);
    // Add "+ Add card" button at the bottom of each phase-body with a .cards container.
    // (Skip phases like the Token deck that have a custom internal layout.)
    document.querySelectorAll('.phase-body').forEach(function(body) {
      if (!body.querySelector(':scope > .cards')) return;
      if (body.querySelector(':scope > .edit-add-card-btn')) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'edit-add-card-btn';
      btn.textContent = '+ Add card';
      btn.onclick = function() { addCard(body); };
      var pptx = body.querySelector(':scope > .pptx-inline');
      if (pptx) body.insertBefore(btn, pptx); else body.appendChild(btn);
    });
    // Add "+ Add phase" button at end of timeline
    var timeline = document.querySelector('.timeline');
    if (timeline && !timeline.querySelector(':scope > .edit-add-phase-btn')) {
      var pBtn = document.createElement('button');
      pBtn.type = 'button';
      pBtn.className = 'edit-add-phase-btn';
      pBtn.textContent = '+ Add phase';
      pBtn.onclick = function() { addPhase(); };
      timeline.appendChild(pBtn);
    }
  }
  function injectPhaseControls(phase) {
    var header = phase.querySelector('.phase-header');
    if (header && !header.querySelector(':scope > .edit-remove-phase')) {
      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'edit-remove-btn edit-remove-phase';
      x.title = 'Remove this phase';
      x.textContent = '×';
      x.onclick = function(e) { e.stopPropagation(); removePhase(phase); };
      header.appendChild(x);
    }
  }
  function injectCardControls(card) {
    if (!card.querySelector(':scope > .card-drag-handle')) {
      var h = document.createElement('span');
      h.className = 'card-drag-handle';
      h.title = 'Drag to reorder';
      h.textContent = '⋮⋮';
      card.appendChild(h);
    }
    if (!card.querySelector(':scope > .edit-remove-card')) {
      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'edit-remove-btn edit-remove-card';
      x.title = 'Remove this card';
      x.textContent = '×';
      x.onclick = function(e) { e.stopPropagation(); removeCard(card); };
      card.appendChild(x);
    }
  }

  // ── Add / Remove ──
  function slugify(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'new-phase';
  }

  function addPhase() {
    var timeline = document.querySelector('.timeline');
    if (!timeline) return;
    var nextNum = timeline.querySelectorAll('.phase').length + 1;
    var phase = document.createElement('div');
    phase.className = 'phase';
    phase.innerHTML =
      '<div class="phase-connector">' +
      '  <div class="phase-dot p-new">📌</div>' +
      '  <div class="phase-line p-new last"></div>' +
      '</div>' +
      '<div class="phase-body p-new has-pptx" data-pptx-key="new-phase-' + nextNum + '">' +
      '  <div class="phase-header">' +
      '    <span class="phase-num p-new">Phase ' + nextNum + '</span>' +
      '    <span class="phase-title">New Phase</span>' +
      '    <button class="pptx-phase-btn" onclick="togglePhasePptx(this)" aria-expanded="false">' +
      '      <span class="pptx-phase-icon">▶</span>' +
      '      <span class="pptx-phase-label">Presentation</span>' +
      '    </button>' +
      '  </div>' +
      '  <div class="cards"></div>' +
      '  <div class="pptx-inline">' +
      '    <div class="pptx-inline-stage"></div>' +
      '    <button class="pptx-nav-btn pptx-nav-prev" onclick="navInlinePptx(this, -1)" aria-label="Previous">‹</button>' +
      '    <button class="pptx-nav-btn pptx-nav-next" onclick="navInlinePptx(this, 1)" aria-label="Next">›</button>' +
      '    <button class="pptx-fs-btn" onclick="toggleInlinePptxFs(this)" title="Fullscreen (F)"><span class="pptx-fs-enter">⛶</span><span class="pptx-fs-exit">✕</span></button>' +
      '    <div class="pptx-inline-counter">0 / 0</div>' +
      '    <div class="pptx-inline-loading"><div class="pptx-spinner"></div><div>Loading slides…</div></div>' +
      '  </div>' +
      '</div>';
    // Append before the + Add phase button
    var addBtn = timeline.querySelector(':scope > .edit-add-phase-btn');
    if (addBtn) timeline.insertBefore(phase, addBtn); else timeline.appendChild(phase);
    // Wire edit controls + sortable + edit IDs on this new phase.
    // IMPORTANT: ensurePhaseHasPptxButton MUST run before injectPhaseControls
    // so the × Remove-phase button ends up as the last button in the header,
    // matching the order of phases rendered on initial load.
    var body = phase.querySelector('.phase-body');
    ensurePhaseHasPptxButton(body);
    injectPhaseControls(phase);
    var addCardBtn = document.createElement('button');
    addCardBtn.type = 'button';
    addCardBtn.className = 'edit-add-card-btn';
    addCardBtn.textContent = '+ Add card';
    addCardBtn.onclick = function() { addCard(body); };
    body.insertBefore(addCardBtn, body.querySelector('.pptx-inline'));
    reassignEditIds();
    if (EDIT_MODE) {
      applyContentEditable(true);
      addSortableForCards(phase.querySelector('.cards'));
    }
    renumberPhases();
    recolorPhases();
    setEditorState('dirty');
    saveToStorage();
    // Pre-seed one empty card so the user sees something to edit
    addCard(body, { silent: true });
  }

  function removePhase(phase) {
    phase.remove();
    renumberPhases();
    recolorPhases();
    setEditorState('dirty');
    saveToStorage();
  }

  function addCard(phaseBody, opts) {
    opts = opts || {};
    var cards = phaseBody.querySelector('.cards');
    if (!cards) return;
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('onclick', 'toggle(this)');
    card.innerHTML =
      '<span class="card-chevron">▼</span>' +
      '<div class="card-header"><span class="card-icon">📄</span><div class="card-title">New Card</div></div>' +
      '<div class="card-detail">' +
      '  <ul><li>Add a detail here</li></ul>' +
      '</div>';
    cards.appendChild(card);
    injectCardControls(card);
    reassignEditIds();
    if (EDIT_MODE) applyContentEditable(true);
    if (!opts.silent) {
      setEditorState('dirty');
      saveToStorage();
    }
  }
  function removeCard(card) {
    card.remove();
    setEditorState('dirty');
    saveToStorage();
  }

  // Give every phase a Presentation button + inline viewer if it doesn't have one.
  function ensurePhaseHasPptxButton(phaseBody) {
    if (!phaseBody.dataset.pptxKey) {
      var titleEl = phaseBody.querySelector('.phase-title');
      phaseBody.dataset.pptxKey = slugify(titleEl ? titleEl.textContent : 'phase');
    }
    phaseBody.classList.add('has-pptx');
    var header = phaseBody.querySelector('.phase-header');
    if (header && !header.querySelector(':scope > .pptx-phase-btn')) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pptx-phase-btn';
      btn.setAttribute('onclick', 'togglePhasePptx(this)');
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<span class="pptx-phase-icon">▶</span><span class="pptx-phase-label">Presentation</span>';
      header.appendChild(btn);
    }
    // Upload + Remove buttons — visible in edit mode only (CSS-gated by body.edit-mode)
    if (header && !header.querySelector(':scope > .pptx-upload-btn')) {
      var up = document.createElement('button');
      up.type = 'button';
      up.className = 'pptx-upload-btn';
      up.setAttribute('onclick', 'uploadPptx(this)');
      up.setAttribute('title', 'Upload a .pptx for this phase (replaces the current one)');
      up.innerHTML = '<span class="pptx-upload-icon">📎</span><span class="pptx-upload-label">Upload</span>';
      header.appendChild(up);
    }
    if (header && !header.querySelector(':scope > .pptx-remove-btn')) {
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'pptx-remove-btn';
      rm.setAttribute('onclick', 'removePptx(this)');
      rm.setAttribute('title', 'Remove the presentation for this phase');
      rm.innerHTML = '<span class="pptx-remove-icon">🗑️</span><span class="pptx-remove-label">Remove deck</span>';
      header.appendChild(rm);
    }
    if (!phaseBody.querySelector(':scope > .pptx-inline')) {
      var viewer = document.createElement('div');
      viewer.className = 'pptx-inline';
      viewer.innerHTML =
        '<div class="pptx-inline-stage"></div>' +
        '<button class="pptx-nav-btn pptx-nav-prev" onclick="navInlinePptx(this, -1)" aria-label="Previous">‹</button>' +
        '<button class="pptx-nav-btn pptx-nav-next" onclick="navInlinePptx(this, 1)" aria-label="Next">›</button>' +
        '<button class="pptx-fs-btn" onclick="toggleInlinePptxFs(this)" title="Fullscreen (F)">' +
          '<span class="pptx-fs-enter">⛶</span><span class="pptx-fs-exit">✕</span></button>' +
        '<div class="pptx-inline-counter">0 / 0</div>' +
        '<div class="pptx-inline-loading"><div class="pptx-spinner"></div><div>Loading slides…</div></div>';
      phaseBody.appendChild(viewer);
    }
  }

  // ── MARKDOWN ↔ DOM ─────────────────────────────────────────────────────
  // The page renders from storage/content.md. Editing the markdown and
  // reloading shows the changes; in-browser edits + Save serialize the DOM
  // back to markdown and POST it to /_save-content.

  // Cycle these classes across phases so colors travel with their position.
  var PHASE_COLORS = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7'];
  // First "non-whitespace, non-letter-or-digit" run at the start of a heading is the icon.
  // Captures emoji, including multi-codepoint ones like 🛡️ or 🤖.
  var ICON_RX = /^([^\s\w][^\s]*?)\s+/u;

  function splitIcon(text) {
    var m = ICON_RX.exec(text);
    if (m) return { icon: m[1], rest: text.slice(m[0].length).trim() };
    return { icon: '', rest: text.trim() };
  }

  // Parse our flavour of markdown:
  //   # Page title (with optional leading emoji)
  //   ## <emoji> <Phase N>: <Phase title>
  //   ### <emoji> <Card title>
  //   - bullet
  function parseContentMd(md) {
    var lines = md.split(/\r?\n/);
    var data = { title: '', phases: [] };
    var phase = null, card = null;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (ln.startsWith('# ')) {
        data.title = ln.slice(2).trim();
      } else if (ln.startsWith('## ')) {
        var heading = ln.slice(3).trim();
        var split = splitIcon(heading);
        // heading.rest may be "Phase N: Title"
        var m = /^(Phase\s+\S+):\s*(.*)$/.exec(split.rest);
        if (m) {
          phase = { icon: split.icon, num: m[1], title: m[2], cards: [] };
        } else {
          phase = { icon: split.icon, num: '', title: split.rest, cards: [] };
        }
        data.phases.push(phase);
        card = null;
      } else if (ln.startsWith('### ') && phase) {
        var hh = ln.slice(4).trim();
        var s = splitIcon(hh);
        card = { icon: s.icon, title: s.rest, bullets: [] };
        phase.cards.push(card);
      } else if (/^\s*-\s+/.test(ln) && card) {
        card.bullets.push(ln.replace(/^\s*-\s+/, '').trim());
      }
    }
    return data;
  }

  function renderRoadmap(data) {
    var titleEl = document.querySelector('.title');
    if (titleEl && data.title) titleEl.textContent = data.title;
    var timeline = document.querySelector('.timeline');
    timeline.innerHTML = '';
    data.phases.forEach(function(ph, idx) {
      timeline.appendChild(renderPhase(ph, idx));
    });
  }

  function renderPhase(ph, idx) {
    var color = PHASE_COLORS[idx % PHASE_COLORS.length];
    var num = ph.num || ('Phase ' + (idx + 1));
    var icon = ph.icon || '📌';
    var phase = document.createElement('div');
    phase.className = 'phase';
    var html =
      '<div class="phase-connector">' +
      '  <div class="phase-dot ' + color + '">' + icon + '</div>' +
      '  <div class="phase-line ' + color + (idx === undefined ? ' last' : '') + '"></div>' +
      '</div>' +
      '<div class="phase-body ' + color + '">' +
      '  <div class="phase-header">' +
      '    <span class="phase-num ' + color + '">' + escapeHtml(num) + '</span>' +
      '    <span class="phase-title">' + escapeHtml(ph.title || '') + '</span>' +
      '  </div>' +
      '  <div class="cards">' +
      ph.cards.map(renderCard).join('') +
      '  </div>' +
      '</div>';
    phase.innerHTML = html;
    return phase;
  }

  function renderCard(card) {
    var icon = card.icon || '📄';
    return (
      '<div class="card" onclick="toggle(this)">' +
      '  <span class="card-chevron">▼</span>' +
      '  <div class="card-header"><span class="card-icon">' + escapeHtml(icon) + '</span>' +
        '<div class="card-title">' + escapeHtml(card.title || '') + '</div></div>' +
      '  <div class="card-detail"><ul>' +
        card.bullets.map(function(b){ return '<li>' + escapeHtml(b) + '</li>'; }).join('') +
      '  </ul></div>' +
      '</div>'
    );
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Serialize the current timeline back to markdown.
  function serializeRoadmapToMd() {
    var titleEl = document.querySelector('.title');
    var lines = [];
    if (titleEl) lines.push('# ' + titleEl.textContent.trim(), '');
    document.querySelectorAll('.timeline .phase').forEach(function(phase, idx) {
      var body = phase.querySelector('.phase-body');
      var dotEl = phase.querySelector('.phase-dot');
      var numEl = phase.querySelector('.phase-num');
      var titleSpan = phase.querySelector('.phase-title');
      var icon = dotEl ? dotEl.textContent.trim() : '';
      var num = numEl ? numEl.textContent.trim() : ('Phase ' + (idx + 1));
      var t = titleSpan ? titleSpan.textContent.trim() : '';
      var head = (icon ? icon + ' ' : '') + num + ': ' + t;
      lines.push('## ' + head, '');
      phase.querySelectorAll('.card').forEach(function(card) {
        var ci = card.querySelector('.card-icon');
        var ct = card.querySelector('.card-title');
        var icon2 = ci ? ci.textContent.trim() : '';
        var t2 = ct ? ct.textContent.trim() : '';
        lines.push('### ' + (icon2 ? icon2 + ' ' : '') + t2);
        card.querySelectorAll('.card-detail li').forEach(function(li) {
          lines.push('- ' + li.textContent.trim().replace(/\s+/g, ' '));
        });
        lines.push('');
      });
    });
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';
  }

  // ── Bootstrap ──
  function initEditor() {
    reassignEditIds();   // assign IDs to editable elements
    document.querySelectorAll('.timeline .phase .phase-body').forEach(ensurePhaseHasPptxButton);
    injectEditControlsAll();
    mountEditorToolbar();
  }

  function bootstrap() {
    fetch('/storage/content.md', { cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(md) {
        var data = parseContentMd(md);
        renderRoadmap(data);
        initEditor();
      })
      .catch(function(err) {
        var t = document.querySelector('.timeline');
        if (t) t.innerHTML = '<div style="padding:40px; color:#dc2626; text-align:center;">' +
          '<div style="font-size:32px;">⚠️</div>' +
          '<div>Failed to load <code>storage/content.md</code>: ' + escapeHtml(String(err.message || err)) + '</div>' +
          '<div style="font-size:12px; color:#94a3b8; margin-top:8px;">Make sure you started the server with <code>python3 backend/server.py</code>.</div></div>';
        // Still mount editor toolbar so the user has Edit available
        try { mountEditorToolbar(); } catch(e){}
      });
  }
  bootstrap();
</script>

</body></html>
